apiVersion: apps/v1
kind: Deployment
metadata:
  name: budget-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: budget-app-deployment
  template:
    metadata:
      labels:
        app: budget-app-deployment
    spec:
      imagePullSecrets:
      - name: registrysecret
      containers:
      - name: app
        image: {{ .Values.werf.image.app }}
        ports:
        - containerPort: 8080
